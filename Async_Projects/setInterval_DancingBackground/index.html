<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>

button{
    width:140px;
    height:45px;
    margin:20px 10px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s ease;
    color:white;
}

.start{
    background:#22c55e;
}

.start:hover{
    background:#16a34a;
    transform:translateY(-3px);
    box-shadow:0 8px 18px rgba(34,197,94,.4);
}

.stop{
    background:#ef4444;
}

.stop:hover{
    background:#dc2626;
    transform:translateY(-3px);
    box-shadow:0 8px 18px rgba(239,68,68,.4);
}

button:active{
    transform:scale(0.95);
}
   </style>
</head>
<body class="bodypage">

    <h2>The background color will change automatically</h2>
    <button class="start">Start</button>
    <button class="stop">Stop</button>

</body>
<script>
    function randomHexCode() {
        const letters = "0123456789ABCDEF";
        let color = "#";

        for (let i = 0; i < 6; i++) {
            color += letters[Math.floor(Math.random() * 16)];
        }

        return color;
    }

    
const changeBackground = function chnacgeBGC(){
    const bodypage = document.querySelector("body");
    // bodypage.style.cssText= `
    // backgroundColor:red;
    // `
    // ;

    Object.assign(bodypage.style,{
        backgroundColor:`${randomHexCode()}`,
        color:`${randomHexCode()}`
    })
}
let intervalFunction = null;
document.querySelector(".start").addEventListener('click',()=>{
     if (intervalFunction) return;
    intervalFunction=setInterval(() => {
        changeBackground();
    }, 1000);
})


document.querySelector(".stop").addEventListener('click',()=>{
    clearInterval(intervalFunction);
intervalFunction = null;

})

   
</script>
</html>
