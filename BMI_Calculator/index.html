<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="outerbox">
        <h2>BMI Calculator</h2>
        <form action="" class="form">
            <p><label for="">Enter weight in KG</label><input type="number" placeholder="  '80 KG'" class="inputs" id="weight"></p>
            <p><label for="">Enter height in CM</label><input type="number" placeholder="  '170 CM'" class="inputs" id="height"></p>
            <button type="submit" class="submit"> Calculate </button>
            <div class="result"></div>
        </form> 

        <div ><img src="" alt="" class="photo"></div>

    </div>
    
</body>
<script src="script.js"></script>
</html>
